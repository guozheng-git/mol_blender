<style>
/* Layout: one-screen instrument panel — identity bar, viewport, then a compact control deck. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --sunken: #e9eeec;
  --fg: #14211e;
  --muted: #5a6a65;
  --line: #d5dedb;
  --accent: #0b7a69;
  --accent-soft: #d9efea;
  --accent-fg: #ffffff;
  --canvas: #ffffff;
  --danger: #a33a2a;
  --warn: #b7791f;
  --shadow: 0 1px 2px rgb(20 33 30 / 0.06), 0 4px 16px rgb(20 33 30 / 0.06);
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #141c19; --sunken: #1a2420; --fg: #e3ebe8; --muted: #8e9f99;
    --line: #26322e; --accent: #45c6ab; --accent-soft: #173a32; --accent-fg: #04201a;
    --canvas: #0a0f0d; --danger: #ef8a78; --warn: #e2b04a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #141c19; --sunken: #1a2420; --fg: #e3ebe8; --muted: #8e9f99;
  --line: #26322e; --accent: #45c6ab; --accent-soft: #173a32; --accent-fg: #04201a;
  --canvas: #0a0f0d; --danger: #ef8a78; --warn: #e2b04a;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-inline: 16px; padding-block: 0; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-block: 12px; max-width: 1200px; margin-inline: auto; }

/* Identity bar */
.bar { display: grid; gap: 8px; min-width: 0; }
.ident { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.entry-id { font-family: var(--font-data); font-weight: 500; font-size: 13px; letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.title { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.meta { margin: 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta span { white-space: nowrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tab { appearance: none; border: 0; background: none; padding: 7px 12px 8px; color: var(--muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible, .chip:focus-visible, .btn:focus-visible, select:focus-visible, .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .count { font-family: var(--font-data); font-size: 11px; color: var(--muted); margin-left: 4px; }

/* 3D panel */
.panel { min-height: 0; }
#panel-3d { display: grid; grid-template-rows: minmax(300px, 1fr) auto auto; gap: 10px; height: 100%; }
.stage { position: relative; min-height: 300px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--canvas); box-shadow: var(--shadow); }
#molstar { position: absolute; inset: 0; }
.stage.dragging::after { content: "Drop to open"; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 8px; display: grid; place-items: center; color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--canvas) 80%, transparent); z-index: 20; }
.status { position: absolute; left: 12px; bottom: 10px; z-index: 10; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); padding: 4px 9px; border-radius: 6px; max-width: calc(100% - 24px); }
.status.error { color: var(--danger); }
.status:empty { display: none; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); min-height: 18px; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .mono { font-family: var(--font-data); color: var(--fg); }

.deck { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.row { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; }
.row .label { width: 46px; flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--fg); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip:disabled { opacity: 0.45; cursor: not-allowed; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; max-width: 100%; min-width: 0; font-family: var(--font-data); font-size: 12.5px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.actions { gap: 6px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--sunken); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Renders and files */
.scroll { height: 100%; overflow: auto; padding-block: 2px 16px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.render { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.thumb { display: block; width: 100%; padding: 0; border: 0; background: var(--sunken); cursor: zoom-in; }
.thumb img { display: block; width: 100%; height: auto; max-width: 100%; }
.render figcaption { padding: 10px 12px; display: grid; gap: 6px; }
.render .name { font-family: var(--font-data); font-size: 12.5px; font-weight: 500; }
.render .desc { color: var(--muted); font-size: 12.5px; }
.render .spec { color: var(--muted); font-size: 11.5px; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.render .btn { justify-self: start; }
.empty { color: var(--muted); padding: 24px 0; max-width: 60ch; }
.files { display: grid; gap: 14px; max-width: 640px; }
.file-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.file-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-family: var(--font-data); font-size: 12.5px; min-width: 0; }
.file-list li:first-child { border-top: 0; }
.file-list .fname { overflow-wrap: anywhere; min-width: 0; }
.file-list .fsize { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { color: var(--muted); font-size: 12.5px; max-width: 65ch; margin: 0; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgb(8 14 12 / 0.55); display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.sheet h2 { margin: 0; font-size: 15px; }
.sheet textarea { width: 100%; min-height: 150px; resize: vertical; font-family: var(--font-data); font-size: 12px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.sheet .row { justify-content: flex-end; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 140px); height: auto; border-radius: 8px; display: block; margin-inline: auto; }
.lightbox .sheet { width: min(1100px, 100%); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; }
@media (max-width: 480px) {
  .row .label { width: 100%; }
  #panel-3d { grid-template-rows: minmax(320px, 58vh) auto auto; height: auto; }
  .app { height: auto; min-height: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

.card-actions .btn { font-size: 12.5px; padding: 4px 9px; }

<script>
/* Mol*'s bundled Emscripten (embind) glue builds two shapes of named wrapper with new Function().
   Artifact pages may forbid evaluating strings, so serve exactly those shapes with closures. */
(() => {
  const Native = Function;
  const named = /^return function [\w$]+\(\) \{\s*"use strict";\s*return body\.apply\(this, arguments\);\s*\};?\s*$/;
  const dyn = /^return function dynCall_[\w$]+\([\w, ]*\) \{\s*return dynCall\(rawFunction(?:, [\w, ]*)?\);\s*\};?\s*$/;
  function SafeFunction(...args) {
    const body = String(args[args.length - 1]);
    if (args.length === 2 && args[0] === 'body' && named.test(body)) return (fn) => function () { return fn.apply(this, arguments); };
    if (args.length === 3 && args[0] === 'dynCall' && args[1] === 'rawFunction' && dyn.test(body)) return (call, raw) => function (...a) { return call(raw, ...a); };
    return Native.apply(this, args);
  }
  SafeFunction.prototype = Native.prototype;
  try { window.Function = SafeFunction; } catch (e) { /* keep the native constructor */ }
})();
</script>

<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('studio-data').textContent);
const $ = (s) => document.querySelector(s);

/* ---------- Constants ---------- */
const WATER = new Set(['HOH', 'WAT', 'DOD', 'H2O', 'SOL', 'TIP', 'TIP3', 'SPC']);
const ION_ELEMENTS = new Set(['LI','NA','K','RB','CS','MG','CA','SR','BA','MN','FE','CO','NI','CU','ZN','CD','HG','PT','AU','AG','PB','AL','GA','CR','MO','W','V','LA','GD','YB','EU','SM','TB','CL','BR','I','F','IOD']);
const ADDITIVES = new Set(['GOL','EDO','PEG','PGE','PG4','1PE','P6G','2PE','12P','15P','PE4','SO4','PO4','ACT','ACY','FMT','DMS','MPD','TRS','EPE','MES','CIT','IMD','BME','NO3','SCN','PEO','MLI','TAR','NH4','CXS','BTB','HEZ','IPA','EOH','MOH','UNX','UNL','DTT','PGO','BU3','FLC','MRD','SIN','MLA']);
const STANDARD = new Set(['ALA','ARG','ASN','ASP','CYS','GLN','GLU','GLY','HIS','ILE','LEU','LYS','MET','PHE','PRO','SER','THR','TRP','TYR','VAL','SEC','PYL','UNK','A','C','G','U','T','I','N','DA','DC','DG','DT','DU','DI']);
/* Common modified residues stay part of the chain; larger non-standard residues are covalent ligands. */
const MODIFIED = new Set(['MSE','SEP','TPO','CSO','CSD','CME','HYP','MLY','M3L','KCX','PCA','OCS','CSX','NEP','HIC','ALY','SAC','MLZ','CGU','TYS','FME','ACE','NH2','NME']);
const COVALENT_MIN_HEAVY = 15;
const NUCLEIC = new Set(['A','C','G','U','T','I','N','DA','DC','DG','DT','DU','DI']);
const PALETTE = ['#4bb5a6','#5e8fea','#e48db2','#9a80dd','#eda953','#68b95a','#df7462','#46a2d6','#c4a23a','#8c98ad'];
const PLDDT = [[90, '#0053d6', 'Very high (>90)'], [70, '#65cbf3', 'Confident (70–90)'], [50, '#ffdb13', 'Low (50–70)'], [-1, '#ff7d45', 'Very low (<50)']];
const LIGAND_CARBON = '#f0a43a';
const DEFAULT_SCENE = { schema: 1, representation: 'cartoon', color: 'chain', chain_colors: {}, opacity: 1, hidden: [], ligands: true, ions: true, waters: false, layers: [], focus: null };
const toInt = (hex) => parseInt(hex.slice(1), 16);
const clone = (v) => JSON.parse(JSON.stringify(v));

/* ---------- State ---------- */
let model = null, viewer = null, loading = Promise.resolve(), spinning = false;
let scene = normalize(DATA.scene);
let appliedFocus = null;
const sync = { mode: 'static', db: null, canWrite: null, writes: Promise.resolve(), lastCameraRequest: null, renders: null, meta: null };
const siteCache = new Map();

/* ---------- Utilities ---------- */
function normalize(s) { return Object.assign(clone(DEFAULT_SCENE), s ? clone(s) : {}); }
function core(s) { const c = clone(s); for (const k of ['note', 'revision', 'updated_by', 'written_at']) delete c[k]; return JSON.stringify(c); }
function toast(text) { const t = $('#toast'); t.textContent = text; t.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2600); }
function status(text, isError) { const s = $('#status'); s.textContent = text || ''; s.classList.toggle('error', !!isError); }
function b64ToBytes(b64) { const bin = atob(b64.replace(/\s+/g, '')); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function gunzip(bytes) { const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function sha256(bytes) { return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), (b) => b.toString(16).padStart(2, '0')).join(''); }
function fmtBytes(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B'; }
function ago(iso) { const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000); return s < 90 ? Math.round(s) + ' s ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : new Date(iso).toLocaleString(); }
function titleCase(s) { return s.length === 3 ? s[0] + s.slice(1).toLowerCase() : s; }
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const use = (name) => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
let downloadsApi;
function downloads() { if (!downloadsApi) downloadsApi = use('downloads'); return downloadsApi; }
async function saveFile(filename, data) {
  const api = await downloads();
  if (!api) { toast('Saving files works when this page is opened on claude.ai.'); return; }
  try { await api.save({ filename, data }); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'too_large' ? 'That file is too large to save from this page.' : 'Saving is not available in this view.'); }
}

function fetchBundle(session) {
  const key = session.asset_ids.join(',');
  if (!bundleCache.has(key)) bundleCache.set(key, Promise.all(session.asset_ids.map((id) => fetch('/_blob/' + id).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }))).then((docs) => {
    const files = {};
    for (const d of docs) for (const e of d.entries || []) { const f = files[e.filename] || (files[e.filename] = { info: e, data: {} }); f.data[e.part] = e.data; }
    return files;
  }));
  return bundleCache.get(key);
}
async function bundleFile(session, file) {
  const item = (await fetchBundle(session))[file.filename];
  if (!item) throw new Error(file.filename + ' is missing from the bundle');
  const text = Array.from({ length: item.info.parts }, (_, i) => { const part = item.data[i + 1]; if (part === undefined) throw new Error('missing part ' + (i + 1)); return part; }).join('');
  const bytes = await gunzip(b64ToBytes(text));
  if (file.sha256 && await sha256(bytes) !== file.sha256) throw new Error(file.filename + ' did not match its checksum');
  return bytes;
}
async function saveBundleFile(session, file, button) {
  const label = button.textContent; button.disabled = true; button.textContent = 'Preparing…';
  try { const bytes = await bundleFile(session, file); await saveFile(file.filename.replace(/\.[^.]+$/, '') + '.zip', new Blob([zipStore([[file.filename, bytes]])])); }
  catch (e) { console.error(e); toast('Could not prepare ' + file.filename + ': ' + (e.message || e)); }
  finally { button.disabled = false; button.textContent = label; }
}
const ROLE_LABEL = { pse: 'PyMOL .pse', blend: 'Blender .blend' };
function actionButton(text, handler) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = text; b.addEventListener('click', () => handler(b)); return b; }
function renderCard(r) {
  const fig = document.createElement('figure'); fig.className = 'render';
  const done = r.status === 'done' || (!r.status && (r.image || r.src));
  if (!done) fig.classList.add(r.status === 'failed' ? 'failed' : 'pending');
  const thumb = document.createElement('button'); thumb.className = 'thumb';
  if (done) {
    const img = document.createElement('img'); img.loading = 'lazy';
    img.src = r.src || '/_blob/' + r.image.asset_id; img.alt = `${r.label || r.preset} render`;
    thumb.append(img); thumb.setAttribute('aria-label', 'Enlarge ' + (r.label || r.preset));
    thumb.addEventListener('click', () => { $('#lightbox-img').src = img.src; $('#lightbox-img').alt = img.alt; $('#lightbox').hidden = false; $('#lightbox-close').focus(); });
  } else {
    thumb.disabled = true;
    const t = document.createElement('span'); if (r.status !== 'failed') t.className = 'pulse';
    t.textContent = r.status === 'failed' ? 'Render failed' + (r.error ? ': ' + r.error : '') : `Rendering ${r.preset || ''}… started ${r.started_at ? ago(r.started_at) : 'just now'}`;
    thumb.append(t);
  }
  const cap = document.createElement('figcaption');
  const name = document.createElement('span'); name.className = 'name'; name.textContent = r.label || r.preset; cap.append(name);
  if (r.note || r.description) { const d = document.createElement('span'); d.className = 'desc'; d.textContent = r.note || r.description; cap.append(d); }
  const spec = [r.preset && r.label !== r.preset ? r.preset : '', r.image && r.image.width ? `${r.image.width}×${r.image.height}` : r.spec || '', r.seconds ? `${Math.round(r.seconds)} s` : '', r.created_at ? ago(r.created_at) : ''].filter(Boolean).join(' · ');
  if (spec) { const s = document.createElement('span'); s.className = 'spec'; s.textContent = spec; cap.append(s); }
  if (done) {
    const actions = document.createElement('div'); actions.className = 'card-actions';
    actions.append(actionButton('Save image', async () => {
      const blob = r.src ? new Blob([b64ToBytes(r.src.split(',')[1])]) : await fetch('/_blob/' + r.image.asset_id).then((x) => x.blob());
      await saveFile(r.filename || (r.image && r.image.filename) || 'render.png', blob);
    }));
    if (r.session) for (const f of r.session.files || []) actions.append(actionButton(ROLE_LABEL[f.role] || f.filename, (b) => saveBundleFile(r.session, f, b)));
    if (r.pse) actions.append(actionButton('PyMOL .pse', (b) => savePacked(r.pse, b)));
    if (r.blend) actions.append(actionButton('Blender .blend', (b) => savePacked(r.blend, b)));
    if (r.camera && viewer) actions.append(actionButton('View this angle', () => { setTab('3d'); setCamera(r.camera, 600); }));
    cap.append(actions);
  }
  fig.append(thumb, cap);
  return fig;
}
function buildGallery() {
  const list = sync.renders || DATA.renders || [];
  const done = list.filter((r) => r.status !== 'failed');
  $('#render-count').textContent = done.length ? String(done.length) : '';
  const g = $('#gallery'); g.replaceChildren();
  if (!list.length) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = 'No renders yet. Ask Claude in the chat, for example “render this view with mint_sky_assembly”, and it will appear here when it finishes.';
    g.append(p); return;
  }
  for (const r of list) g.append(renderCard(r));
}
function buildFiles() {
  const box = $('#files'); box.replaceChildren();
  if (sync.renders) {
    const ul = document.createElement('ul'); ul.className = 'file-list';
    const addRow = (label, size, entry, handler) => {
      const li = document.createElement('li'); const a = document.createElement('span'); a.className = 'fname'; a.textContent = label;
      const right = document.createElement('span'); right.className = 'fsize'; right.textContent = fmtBytes(size || 0);
      li.append(a, right);
      if (entry || handler) li.append(actionButton('Save', handler || ((b) => savePacked(entry, b))));
      ul.append(li);
    };
    const st = sync.meta && sync.meta.structure;
    if (st && st.asset_id) addRow(st.filename, st.bytes, { filename: st.filename, asset_ids: [st.asset_id], encoding: 'text', sha256: st.sha256 });
    const src = sync.meta && sync.meta.source_session;
    if (src && src.asset_ids) for (const f of src.files || []) addRow(`${f.filename} · uploaded session`, f.bytes, null, (b) => saveBundleFile(src, f, b));
    for (const r of sync.renders) {
      if (r.session) for (const f of r.session.files || []) addRow(`${f.filename} · ${r.label || r.preset}`, f.bytes, null, (b) => saveBundleFile(r.session, f, b));
      for (const role of ['pse', 'blend']) if (r[role]) addRow(`${r[role].filename} · ${r.label || r.preset}`, r[role].bytes, r[role]);
    }
    const p = document.createElement('p'); p.className = 'note';
    p.textContent = 'Session files are stored in this workspace and download as .zip files. Open .pse files in PyMOL and .blend files in Blender 5.0 or newer.';
    if (!ul.children.length) { p.textContent = 'No session files yet. Renders made from the chat add their PyMOL session and Blender scene here.'; box.append(p); return; }
    box.append(ul, p); return;
  }
  const d = DATA.downloads; const p = document.createElement('p'); p.className = 'note';
  if (!d) { p.textContent = 'No session files are attached to this page.'; box.append(p); return; }
  const ul = document.createElement('ul'); ul.className = 'file-list';
  for (const f of d.contents) { const li = document.createElement('li'); const a = document.createElement('span'); a.className = 'fname'; a.textContent = f.name; const b = document.createElement('span'); b.className = 'fsize'; b.textContent = fmtBytes(f.size); li.append(a, b); ul.append(li); }
  const btn = document.createElement('button'); btn.className = 'btn primary'; btn.textContent = `Save ${d.filename} (${fmtBytes(d.size)})`;
  btn.addEventListener('click', () => saveFile(d.filename, new Blob([b64ToBytes(d.data)])));
  p.textContent = 'Session files bundled as one .zip.';
  box.append(ul, btn, p);
}

async function main() {
  window.studio = { get viewer() { return viewer; }, get model() { return model; }, get scene() { return scene; }, sync, resolve, buildScene };
  wire(); buildGallery(); buildFiles();
  if (DATA.initial_tab) setTab(DATA.initial_tab);
  try {
    const s = DATA.structure;
    let bytes = b64ToBytes(s.data); if (s.gzip) bytes = await gunzip(bytes);
    await loadModel(bytes, s.filename, DATA.predicted);
  } catch (e) { console.error(e); status('Could not read the embedded structure: ' + (e.message || e), true); return; }
  const connected = connect();
  try { await createViewer(); applyBackground(); }
  catch (e) { console.error(e); status(e.message || String(e), true); return; }
  await connected;
  /* Give the first database snapshots a moment so a saved shared camera beats the embedded one. */
  if (sync.db && sync.cameraKnown === undefined) await new Promise((r) => setTimeout(r, 600));
  const opening = sync.pendingCamera || DATA.camera || null;
  sync.pendingCamera = null;
  await draw({ fresh: true, camera: opening });
  sync.drawn = true;
  if (sync.pendingCamera) { await settleCamera(sync.pendingCamera); sync.pendingCamera = null; }
  /* A new workspace has no shared camera yet: record the opening view once so renders match the panel. */
  setTimeout(() => {
    if (sync.mode === 'live' && sync.cameraKnown === false && viewer) writeDoc('scene/camera', Object.assign(cameraNow(), { by: 'page', saved_at: new Date().toISOString(), initial: true }));
  }, 2500);
}
main();
})();
</script>
