[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymol-plugin-bridge"
version = "0.1.0"
description = "PyMOL -> Blender GPU/SLURM bridge plugin and runner."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PyMOL Plugin Bridge" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
bridge_runner = "blender_render.bridge_runner:main"

[tool.setuptools]
packages = ["blender_render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
