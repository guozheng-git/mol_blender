[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pymol-plugin-bridge"
version = "0.4.0rc2"
description = "Molecular rendering from PyMOL, Claude, and Codex, locally or through optional Slurm workers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Magnus Bauer" }]
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/GPL-3.0-or-later.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = ["jsonschema>=4.23,<5", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "numpy==1.26.4", "build>=1.2,<2", "playwright>=1.50,<2"]
mcp = ["fastmcp==2.14.7"]
hosted = ["fastmcp==2.14.7"]
cluster = ["starlette==1.10.0", "uvicorn==0.54.0"]

[project.scripts]
blender-render = "blender_render.cli:main"

[tool.setuptools]
packages = ["blender_render", "blender_render.hosted", "blender_render.cluster"]

[tool.setuptools.package-data]
blender_render = ["*.json", "*.txt"]

[project.urls]
Homepage = "https://github.com/magnusbauer/blender_render"
Issues = "https://github.com/magnusbauer/blender_render/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
