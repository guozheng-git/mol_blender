[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0", "PyYAML==6.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pymol-plugin-bridge"
version = "0.4.0rc4"
description = "Molecular rendering from PyMOL, Claude, and Codex, locally or through optional Slurm workers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Magnus Bauer" }]
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/GPL-3.0-or-later.txt", "THIRD_PARTY_NOTICES.md"]
# Pillow is used in the Python 3.11 renderer, including co-PyMOL's detached gallery.
# The PyMOL-only 3.10 install deliberately skips this renderer dependency.
dependencies = ["jsonschema>=4.23,<5", "pillow>=13,<14; python_version >= '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "numpy==1.26.4", "build>=1.2,<2", "playwright>=1.50,<2", "PyYAML==6.0.3"]
mcp = ["fastmcp==3.4.11", "mcp>=1.30.0,<2"]
hosted = ["fastmcp==3.4.11", "mcp>=1.30.0,<2"]
cluster = ["starlette==1.10.0", "uvicorn==0.54.0"]
# Installed into PyMOL's own Python for the co_pymol MCP server.
pymol = ["mcp>=1.30.0,<2", "anyio>=4.0", "numpy>=1.24", "gemmi>=0.6"]

[dependency-groups]
security = ["pip-audit==2.10.1"]

[project.scripts]
mol-blender = "mol_blender.cli:main"

[tool.setuptools]
packages = ["mol_blender", "mol_blender.scene", "mol_blender.hosted", "mol_blender.cluster",
            "co_pymol", "co_pymol.core", "co_pymol.scene", "co_pymol.render", "co_pymol.tools", "co_pymol.utils"]

[tool.setuptools.package-data]
mol_blender = ["*.json", "*.txt"]
co_pymol = ["instructions.md", "scene/molecular-data.json"]

[project.urls]
Homepage = "https://github.com/magnusbauer/blender_render"
Issues = "https://github.com/magnusbauer/blender_render/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
