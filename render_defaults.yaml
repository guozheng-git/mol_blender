# Shared authoring source for the renderer, PyMOL and Structure Studio.
# Run: python scripts/sync_render_defaults.py
# Preset-specific output settings and explicit request options take precedence.
version: 1
image:
  preset: mint_sky_assembly
  cutaway_preset: cyan_mint_cutaway
  preview:
    width: 800
    height: 0  # Follow the saved viewport aspect ratio.
    samples: 32
  cpu:
    long_edge: 1280
    samples: 64
  rough:
    scale: 2
    min_width: 320
    min_height: 240
    min_samples: 8
    max_samples: 32
animation:
  fps: 24
  gif: false
  preview:
    width: 640
    height: 0
    samples: 32
  # Simple renderer orbits retain their shorter legacy timings.
  orbits:
    rock:
      duration: 3
      rock_angle: 12
    "360":
      duration: 6
  recipes:
    turntable:
      duration: 10
    rock:
      duration: 6
      rock_angle: 25
    reveal:
      overview_hold: 1.5
      approach: 3
      focus_hold: 1
      rock_duration: 4
      rock_angle: 12
    cutaway:
      overview_hold: 1.5
      approach: 3
      before_fade_hold: 0.5
      fade_duration: 2
      after_fade_hold: 0.5
      rock_duration: 4
      rock_angle: 12
      pymol_shell_transparency: 0.8
    states:
      min_duration: 4
      seconds_per_state: 0.25
      rock_angle: 10
    scenes:
      hold_duration: 1.5
      transition_duration: 2.5
# Enforced bounds, never request-overridable defaults.
limits:
  animation:
    min_frames: 4
    max_frames: 360
    max_fps: 60
    max_duration: 15
    max_rock_angle: 45
    max_rgba_bytes: 10737418240  # 10 GiB decoded RGBA.
    max_archive_bytes: 536870912  # 512 MiB frame archive.
