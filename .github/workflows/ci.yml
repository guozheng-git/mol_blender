name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.7'
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --all-extras
      - name: Install PyMOL system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglu1-mesa libxrender1 libxext6
      - name: Install pinned PyMOL into the test interpreter
        run: uv pip install --python .venv/bin/python --no-deps --require-hashes -r plugins/molblender_studio/skills/molblender-studio/references/pymol-requirements.txt
      - name: Install headless Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Locate Chromium
        id: browser
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright, open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'executable={playwright.chromium.executable_path}\n')
          PY
      - name: Verify shared defaults
        run: uv run --no-sync python scripts/sync_render_defaults.py --check
      - name: Run renderer, browser and real PyMOL checks
        env:
          MOLBLENDER_STUDIO_TEST_PYMOL: ${{ github.workspace }}/.venv/bin/python
        run: uv run --no-sync python -m pytest tests --ignore=tests/co_pymol --browser='${{ steps.browser.outputs.executable }}' -ra --junitxml=.validation/renderer-tests.xml
      - name: Run co-PyMOL suite in its test interpreter
        run: uv run --no-sync python -m pytest tests/co_pymol -ra --junitxml=.validation/co-pymol-tests.xml
      - name: Build wheel and plugin packages
        run: uv run --no-sync python scripts/build_plugin.py --output .validation/package
      - name: Verify wheel matches tested source
        run: |
          uv run --no-sync python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          wheel, = Path('.validation/package').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pytest',
                          'tests/test_molblender_studio.py::test_staged_wheel_matches_renderer_source', '-q'],
                         env={**os.environ, 'MOLBLENDER_STUDIO_TEST_WHEEL': str(wheel)}, check=True)
          PY
      - name: Check installed wheel outside checkout
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check/bin/python" .validation/package/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I - <<'PY'
          import json
          from pathlib import Path
          from mol_blender import engine
          import co_pymol
          root = Path(engine.__file__).parent
          assert json.loads((root / 'engine-manifest.json').read_text()) == engine.generate_manifest(root) == engine.engine_identity()
          print('Installed wheel manifest verified')
          PY
          "$RUNNER_TEMP/wheel-check/bin/mol-blender" presets
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: .validation/*tests.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.7'
      - run: uv run --locked --group security python scripts/audit_dependencies.py --output .validation/dependencies.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: .validation/dependencies.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error --proto '=https' -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --log-opts=--all --no-banner .'

  required:
    name: CI
    if: always()
    needs: [tests, dependencies, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          TESTS: ${{ needs.tests.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: test "$TESTS" = success && test "$DEPENDENCIES" = success && test "$SECRETS" = success
