title = "mol-blender public examples"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public renderer preview cache SHA-256 values, not access tokens"
condition = "AND"
paths = ['''(^|/)examples/developer/acceptance\.json$''']
regexTarget = "line"
regexes = ['''^\s*"preview_key": "[0-9a-f]{64}",?\s*$''']

[[rules.allowlists]]
description = "Historical request-id example in the consumer guide"
condition = "AND"
paths = ['''(^|/)docs/mcp-consumer\.md$''']
regexTarget = "line"
regexes = ['''^\s*"request_key": "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",?\s*$''']

[[rules.allowlists]]
description = "Historical prose misclassified as an authentication token"
condition = "AND"
paths = ['''(^|/)docs/plans/blender-render-progress\.md$''']
regexTarget = "match"
regexes = ['''^authentication, quota/budget/retention $''']

[[rules.allowlists]]
description = "Historical lifecycle fixture's literal operation key"
condition = "AND"
paths = ['''(^|/)tests/test_operation_lifecycle\.py$''']
regexTarget = "line"
regexes = ['''^\s*service\.submit\('a', source, \{'rough': True\}, 'preview-key', operation_key='intent1'\)\s*$''']
