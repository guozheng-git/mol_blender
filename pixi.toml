[workspace]
name = "pymol-plugin-bridge"
version = "0.1.0"
description = "PyMOL plugin bridge environment"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
pytest = "*"

[pypi-dependencies]
pymol-plugin-bridge = { path = ".", editable = true }
jsonschema = ">=4,<5"
bpy = "==5.0.1"
molecularnodes = "==4.5.10"

[tasks]
bridge-help = "python -m blender_render.bridge_runner --help"
render-server = "python -m blender_render.render_server --host 0.0.0.0 --port 8765"
render-server-help = "python -m blender_render.render_server --help"
render-server-verbose = "python -m blender_render.render_server --host 0.0.0.0 --port 8765 --verbose 1"
test = "python -m pytest -q"
