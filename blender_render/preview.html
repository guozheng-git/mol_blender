<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blender Render</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}body{margin:0;padding:16px}h1{font-size:17px;margin:0 0 12px}img{display:block;width:100%;max-height:560px;object-fit:contain;border-radius:12px;background-color:#f7f7f7;background-image:linear-gradient(45deg,#e8e8e8 25%,transparent 25%),linear-gradient(-45deg,#e8e8e8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e8e8 75%),linear-gradient(-45deg,transparent 75%,#e8e8e8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;padding:9px 14px;border:1px solid #698c77;border-radius:9px;background:transparent;color:inherit;cursor:pointer}p{color:#78827c;font-size:12px;margin-bottom:0}
</style>
<h1>Molecular render</h1><img id="preview" alt="Ray-traced molecular structure" hidden><nav id="downloads"></nav><p id="status">Loading the completed render…</p>
<script>
let nextId=1;const pending=new Map();
function request(method,params){const id=nextId++;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function render(result){
 if(!result?.artifacts)return;
 const nav=document.getElementById('downloads');nav.replaceChildren();
 const image=document.getElementById('preview');
 for(const file of result.artifacts){
  if(!['render.png','render.blend','manifest.json'].includes(file.name))continue;
  let url;try{url=new URL(file.download_url);if(url.protocol!=='https:')continue}catch{continue}
  if(file.name==='render.png'){image.src=url.href;image.hidden=false}
  const button=document.createElement('button');button.textContent={'render.png':'Download PNG','render.blend':'Download Blender scene','manifest.json':'Download manifest'}[file.name];
  button.onclick=()=>{if(window.openai?.openExternal)window.openai.openExternal({href:url.href});else request('ui/open-link',{url:url.href}).catch(()=>{document.getElementById('status').textContent='Ask for fresh download links in the conversation.'})};nav.append(button);
 }
 document.getElementById('status').textContent='Transparent PNG. Download links expire after 15 minutes; files are retained for 24 hours.';
}
window.addEventListener('message',event=>{if(event.source!==parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)){const task=pending.get(message.id);pending.delete(message.id);message.error?task.reject(message.error):task.resolve(message.result)}if(message.method==='ui/notifications/tool-result')render(message.params?.structuredContent)});
window.addEventListener('openai:set_globals',event=>render(event.detail?.globals?.toolOutput));
render(window.openai?.toolOutput);
request('ui/initialize',{appInfo:{name:'Blender Render',version:'0.2.0b1'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*')).catch(()=>{});
</script></html>
